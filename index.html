<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiger Deals Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="dashboard">
            <div class="user-info">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=f39c12&color=fff" alt="Avatar">
                <div class="user-details">
                    <span id="user-greeting">Welcome, User</span>
                    <span class="brand-tag">Tiger Deals</span>
                </div>
            </div>
            
            <div class="wallet-card">
                <div class="wallet-left">
                    <span class="wallet-label">Wallet Balance</span>
                    <h2 id="wallet-balance">₹0.00</h2>
                </div>
                <button id="btn-deposit" class="btn-primary">
                    <i class="fa-solid fa-wallet"></i> Add Funds
                </button>
            </div>
        </header>

        <nav class="category-tabs">
            <button class="cat-btn active" data-category="instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </button>
            <button class="cat-btn" data-category="telegram">
                <i class="fa-brands fa-telegram"></i> Telegram
            </button>
            <button class="cat-btn" data-category="facebook">
                <i class="fa-brands fa-facebook"></i> Facebook
            </button>
        </nav>

        <div id="sub-category-filters" class="sub-filters">
            </div>

        <main class="product-grid" id="product-container">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading deals...
            </div>
        </main>
    </div>

    <div id="purchase-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Confirm Order</h3>
                <button id="close-modal"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="modal-product-name" class="highlight-text">1000 Followers</p>
                <p class="price-tag">Price: <span id="modal-price">₹160</span></p>
                
                <div class="input-group">
                    <label id="modal-input-label" for="target-link">Target Link / Username</label>
                    <input type="text" id="target-link" placeholder="Paste link here..." autocomplete="off">
                    <span id="input-error" class="error-text"></span>
                </div>
            </div>
            <button id="btn-confirm-buy" class="btn-primary full-width">Buy Now</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
